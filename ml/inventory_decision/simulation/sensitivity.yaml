# Sensitivity scenarios for Stage 13 inventory simulation
# Nine distinct configurations as approved.
# Each entry defines lead_time_days, safety_stock_multiplier, review_period_multiplier, and optional policy.
# Base safety stock units = 5 (as per user instruction).
# Review period demand is defined as base_review * multiplier (base_review = 5).

